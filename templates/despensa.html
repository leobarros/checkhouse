{% extends "base.html" %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-8 offset-md-2">
        
        <div class="d-flex align-items-center justify-content-between mb-3">
            <div class="d-flex align-items-center">
                <a href="/" class="btn btn-outline-secondary btn-sm me-3"><i class="bi bi-arrow-left"></i> Voltar</a>
                <h3 class="m-0"><i class="bi bi-box-seam text-primary"></i> Despensa: <span class="text-dark">{{ local.nome }}</span></h3>
            </div>
            <a href="{{ url_for('ver_lista', local_id=local.id) }}" class="btn btn-warning btn-sm fw-bold"><i class="bi bi-cart"></i> Ver Lista</a>
        </div>

        <!-- Formulário simplificado (Sem Validade) -->
        <div class="card shadow-sm mb-4 border-0">
            <div class="card-body bg-light rounded">
                <form action="/adicionar_produto/{{ local.id }}" method="POST" class="row g-2">
                    <div class="col-md-8 col-12">
                        <input type="text" name="nome" class="form-control" placeholder="Nome do Produto (ex: Arroz)" required autofocus>
                    </div>
                    <div class="col-md-2 col-6">
                        <input type="number" name="quantidade" class="form-control" placeholder="Qtd" value="1" min="1" required>
                    </div>
                    <div class="col-md-2 col-6">
                        <button type="submit" class="btn btn-success w-100"><i class="bi bi-plus-lg"></i> Add</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Lista de Produtos -->
        <div class="table-responsive bg-white shadow-sm rounded border-0">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Produto</th>
                        <th>Qtd</th>
                        <th class="text-end">Ação</th>
                    </tr>
                </thead>
                <tbody>
                    {% for produto in produtos %}
                    <tr>
                        <td><span class="fs-6 fw-semibold">{{ produto.nome }}</span></td>
                        <td>
                            <div class="d-flex align-items-center">
                                <form action="{{ url_for('atualizar_qtd', produto_id=produto.id, acao='menos') }}" method="POST" class="m-0">
                                    <button type="submit" class="btn btn-sm btn-outline-secondary px-2 py-0" {% if produto.quantidade == 0 %}disabled{% endif %}><i class="bi bi-dash"></i></button>
                                </form>
                                
                                <span class="mx-3 fs-5 {% if produto.quantidade == 0 %}text-danger fw-bold{% endif %}">
                                    {{ produto.quantidade }}
                                </span>
                                
                                <form action="{{ url_for('atualizar_qtd', produto_id=produto.id, acao='mais') }}" method="POST" class="m-0">
                                    <button type="submit" class="btn btn-sm btn-outline-secondary px-2 py-0"><i class="bi bi-plus"></i></button>
                                </form>
                            </div>
                        </td>
                        <td class="text-end">
                            <form action="{{ url_for('eliminar_produto', produto_id=produto.id) }}" method="POST" class="m-0" style="display: inline;">
                                <button type="submit" class="btn btn-link text-danger p-0" onclick="return confirm('Remover este item definitivamente da despensa?');">
                                    <i class="bi bi-trash3 fs-5"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="3" class="text-center text-muted py-4">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            A despensa está vazia!
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

    </div>
</div>
{% endblock %}

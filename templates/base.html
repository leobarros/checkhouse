<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheckHouse</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
    <!-- Link para o Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Link para os Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-body">
<!-- Barra de Navegação com Menu Hambúrguer -->
<!-- Barra de Navegação no topo -->
    <nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="/">🏠 CheckHouse</a>
            
            {% if current_user.is_authenticated %}
            <!-- Menu Hamburger (Só aparece se estiver logado) -->
            <div class="dropdown">
                <!-- Ícone do Hamburger -->
                <button class="btn btn-primary border-0 p-1" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-list" style="font-size: 2rem;"></i>
                </button>
                
                <!-- Conteúdo do Menu (Dropdown) -->
                <ul class="dropdown-menu dropdown-menu-end shadow-lg p-3 rounded-4 border-0" style="min-width: 280px; margin-top: 10px;">
                    
                    <!-- Avatar e Saudação (Fiel ao desenho) -->
                    <li class="d-flex align-items-center mb-3 px-2">
                        <!-- Gera um círculo com a primeira letra do utilizador maiúscula -->
                        <div class="bg-primary text-white rounded-circle d-flex justify-content-center align-items-center me-3 shadow-sm" style="width: 50px; height: 50px; font-size: 1.5rem; font-weight: bold;">
                            {{ current_user.username[0] | upper }}
                        </div>
                        <span class="fs-5 fw-bold text-body">Olá, {{ current_user.username | capitalize }}</span>
                    </li>
                    
                    <li><hr class="dropdown-divider mb-2"></li>
                    
                    <!-- Botão de Tema -->
                    <li>
                        <button class="dropdown-item d-flex align-items-center py-2 rounded text-body" type="button" onclick="alternarTema()">
                            <i class="bi bi-moon-stars fs-5 me-3 text-secondary"></i>
                            <span class="fs-6 fw-medium">Mudar Tema</span>
                        </button>
                    </li>
                    
                    <li><hr class="dropdown-divider my-2"></li>
                    
                    <!-- Configurações -->
                    <li>
                        <a class="dropdown-item d-flex align-items-center py-2 rounded text-body" href="{{ url_for('configuracoes') }}">
                            <i class="bi bi-gear fs-5 me-3 text-secondary"></i>
                            <span class="fs-6 fw-medium">Configurações</span>
                        </a>
                    </li>
                    
                    <li><hr class="dropdown-divider mt-2 mb-3"></li>
                    
                    <!-- Botão Sair (Alinhado à direita conforme desenho) -->
                    <li class="text-end px-2">
                        <a href="{{ url_for('logout') }}" class="btn btn-outline-dark px-4 rounded-3 fw-bold">Sair</a>
                    </li>
                </ul>
            </div>
            {% endif %}
        </div>
    </nav>

    <!-- O conteúdo de cada página vai entrar aqui -->
    <div class="container mb-5">
        {% block content %}{% endblock %}
    </div>

    <!-- Rodapé adaptável ao tema -->
    <footer class="mt-auto py-3 bg-body-tertiary border-top shadow-sm">
        <div class="container text-center">
            <small class="text-body-secondary">
                Desenvolvido por <strong>Leonardo Sales</strong> &copy; <span id="anoAtual"></span>
            </small>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('anoAtual').textContent = new Date().getFullYear();
        
        // Gestão do Tema Claro/Escuro
        const temaSalvo = localStorage.getItem('temaCheckHouse') || 'light';
        document.documentElement.setAttribute('data-bs-theme', temaSalvo);

        function alternarTema() {
            const temaAtual = document.documentElement.getAttribute('data-bs-theme');
            const novoTema = temaAtual === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-bs-theme', novoTema);
            localStorage.setItem('temaCheckHouse', novoTema);
        }
    </script>
</body>
</html>

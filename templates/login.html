{% extends "base.html" %}

{% block titulo %}Entrar · CheckHouse{% endblock %}
{% block largura %}ch-conteudo ch-conteudo--estreito{% endblock %}

{% block content %}
<div class="card shadow border-0">
    <div class="card-body p-4 p-sm-5">
        <div class="text-center mb-4">
            <span class="ch-marca-icone ch-marca-icone--grande mb-3" aria-hidden="true">
                <i class="bi bi-house-door-fill"></i>
            </span>
            <h1 class="h3 text-primary-emphasis mb-1">CheckHouse</h1>
            <p class="text-body-secondary mb-0">Entre para acessar as suas casas</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label class="form-label" for="username">Usuário</label>
                <input type="text" id="username" name="username" class="form-control"
                       autocomplete="username" required data-autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label" for="senha">Senha</label>
                <input type="password" id="senha" name="senha" class="form-control"
                       autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-semibold">Entrar</button>

            <p class="text-center mt-3 mb-0">
                <small class="text-body-secondary">
                    Não tem uma conta?
                    <a href="{{ url_for('registrar') }}" class="fw-semibold text-decoration-none">Registre-se aqui</a>
                </small>
            </p>
        </form>
    </div>
</div>
{% endblock %}

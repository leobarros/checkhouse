{% extends "base.html" %}

{% block content %}
<div class="row">
    <!-- Coluna centralizada -->
    <div class="col-md-6 offset-md-3 col-sm-12">
        
        <!-- Formulário para adicionar um novo Local -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title text-center mb-3">Adicionar Nova Casa/Local</h5>
                <form action="/adicionar_local" method="POST">
                    <div class="input-group">
                        <input type="text" name="nome" class="form-control" placeholder="Ex: Casa Principal, Sítio..." required>
                        <button type="submit" class="btn btn-primary">Adicionar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Lista das Casas cadastradas -->
        <h5 class="mb-3 text-secondary">Meus Locais</h5>
            <div class="list-group shadow-sm">
                {% for local in locais %}
                    <div class="list-group-item list-group-item-action p-3">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <strong class="fs-5">{{ local.nome }}</strong>
                            <form action="{{ url_for('eliminar_local', local_id=local.id) }}" method="POST" class="m-0">
                                <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('ATENÇÃO: Apagar esta casa?');">X</button>
                            </form>
                        </div>
                        <div class="d-flex gap-2">
                            <a href="{{ url_for('ver_lista', local_id=local.id) }}" class="btn btn-warning w-50 fw-bold">🛒 Lista</a>
                            <a href="{{ url_for('ver_despensa', local_id=local.id) }}" class="btn btn-primary w-50 fw-bold">📦 Despensa</a>
                        </div>
                    </div>
                {% else %}
                    <div class="alert alert-info text-center mt-2">Você ainda não tem nenhum local cadastrado.</div>
                {% endfor %}
            </div>

    </div>
</div>
{% endblock %}

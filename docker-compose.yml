services:
  checkhouse:
    # Constrói a imagem a partir do código deste repositório e usa o mesmo nome
    # da imagem publicada, para continuar podendo ser publicada/baixada.
    build:
      context: .
      dockerfile: dockerfile
    image: nickolback/checkhouse:latest
    container_name: checkhouse_app
    ports:
      - "5000:5000"
    volumes:
      - ./dados:/app/dados
    restart: unless-stopped

    environment:
      # Fuso horário das datas mostradas na lista/despensa. O host não importa:
      # sem isto o container roda em UTC e os horários saem errados.
      TZ: ${TZ:-America/Sao_Paulo}

    # --- Limites de recursos -------------------------------------------------
    # Valores tirados de testes reais (ver RELATORIO-RECURSOS.md): a aplicação
    # gasta ~58 MB em repouso e ~136 MB no pior caso previsto (dois logins ao
    # mesmo tempo — cada verificação de senha scrypt pede ~32 MB por instantes).
    # Os limites abaixo são tetos de segurança, não reservas: só são usados se
    # algo der errado, e evitam que a aplicação derrube o resto do home lab.
    cpus: 1.5                # 1 processo Python não passa de ~1,1 núcleos
    mem_limit: 256m
    memswap_limit: 256m      # igual a mem_limit = sem swap (host só tem 6 GB)
    mem_swappiness: 0
    pids_limit: 64           # impede uma explosão de processos

    # --- Endurecimento -------------------------------------------------------
    read_only: true          # o container só escreve no volume ./dados e /tmp
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true

    # --- Logs ----------------------------------------------------------------
    # Sem isto, o arquivo json-file do Docker cresce sem limite no disco.
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

    # Verificação de saúde: o /login é servido sem tocar no banco de dados.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/login', timeout=5).status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
